<h2 style="font-size:24px;margin-top:24px">Latest messages</h2>${S.sermons.map(x=>`<div class="li"><div><b>${e(x.t)}</b><span>${e(x.s)} · ${e(x.d)}</span></div></div>`).join("")}</div>`;popups()}
let last=null;
function render(){const v=view();if(v=="a"){adm();scrollTo(0,0)}else if(v=="m"){mem();scrollTo(0,0)}else{$("root").innerHTML=pub();popups();const h=location.hash.slice(1),el=h&&$(h);if(el)el.scrollIntoView();else scrollTo(0,0)}last=v}
addEventListener("hashchange",()=>{if(view()!==last)render()});
async function api(m,u,b,t){const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json",...(t?{Authorization:"Bearer "+t}:{})},body:b===undefined?undefined:JSON.stringify(b)});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||"Request failed"),{status:r.status});return j}
async function loadPub(){const j=await api("GET","/api/public");S=j;["visits","gifts","books","prayers","members","gallery","bdays","slots","events","sermons","cells","mins","acts","meets","times","stats"].forEach(k=>S[k]=S[k]||[]);S.live=S.live||{t:"Sunday Service",u:"",on:false};S.social=S.social||{}}
function srvSave(){if(!AT)return;if(SV){DIRTY=true;return}flush()}
async function flush(){SV=true;do{DIRTY=false;try{const j=await api("PUT","/api/admin/state",{state:S,since:SID},AT);SID=j.sid;Object.keys(j.added).forEach(k=>j.added[k].forEach(x=>{if(!S[k].some(y=>y.sid==x.sid))S[k].push(x)}))}catch(e){if(e.status==401){toast("Session expired. Please log in again.");logoutA();break}toast("Could not save. Check your connection.")}}while(DIRTY);SV=false}
async function backup(){try{const r=await fetch("/api/admin/state",{headers:{Authorization:"Bearer "+AT}});const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download="church-backup-"+iso(new Date())+".json";a.click()}catch(e){toast("Backup failed")}}
function logoutA(){authed=false;AT="";if(SM)loadPub().then(()=>{location.hash="#top";render()});else location.hash="#top"}
function logoutM(){me=null;MT="";if(SM)loadPub().then(()=>{location.hash="#top";render()});else location.hash="#top"}
async function sendS(){const n=$("n").value.trim();if(!n){$("n").focus();return}try{await api("POST","/api/lead",{n,p:$("p").value.trim(),s:$("s").value,src:$("sr").value||"Other"});track("lead_submit",{lead_source:$("sr").value||"Other"});$("f").hidden=true;const o=$("ok");o.hidden=false;o.textContent="Thank you, "+n+". Your seat is saved for "+$("s").value+". We will call you soon."}catch(x){toast(x.message)}}
async function bookS(){const n=$("bn").value.trim(),p=$("bp").value.trim();if(!n||!p){toast("Enter your name and phone number");return}const x=S.slots[bsel];try{await api("POST","/api/book",{n,p,x:$("bx").value.trim(),slot:{d:x.d,tm:x.tm,ty:x.ty}},MT);S.slots.splice(bsel,1);track("appointment_request");bsel=-1;bdone="Thank you, "+n+". Your request for "+dt(x.d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+" at "+x.tm+" has been sent. The pastor’s office will confirm it shortly.";$("bkbox").innerHTML=bookHtml()}catch(e){toast(e.message)}}
async function giveS(){const a=+$("amount").value;if(!a||a<100){toast("Enter an amount of at least ₦100");return}try{await api("POST","/api/gift",{a,ty:$("gty").value,n:$("gn").value.trim()},MT);track("give_click",{value:a,gift_type:$("gty").value});toast("Thank you! Gift of "+N(a)+" recorded (demo)")}catch(e){toast(e.message)}}
function inject(j){me=j.member.p;MT=j.token;S.members=[j.member];S.gifts=j.gifts||[];S.books=j.books||[];if(j.bdays)S.bdays=j.bdays}
async function msignS(){const n=$("mn").value.trim(),p=$("mp").value.trim(),k=$("mk").value.trim();if(!n||!p||k.length<4){toast("Enter your name, phone, and a PIN of 4 or more");return}try{inject(await api("POST","/api/signup",{n,p,k,b:$("mb")?$("mb").value:"",wa:$("mw")?$("mw").value.trim():"",oi:$("mo")?$("mo").checked:false}));mem()}catch(e){toast(e.message)}}
async function mlogS(){try{inject(await api("POST","/api/login",{p:$("mp").value.trim(),k:$("mk").value}));mem()}catch(e){toast(e.message)}}
async function msetS(){try{await api("POST","/api/member/update",{cell:$("mc").value},MT);S.members[0].cell=$("mc").value;toast("Cell group saved");mem()}catch(e){toast(e.message)}}
async function mwaS(){const w=$("mw2").value.trim(),o=$("mo2").checked&&!!w;try{await api("POST","/api/member/update",{wa:w,oi:o},MT);Object.assign(S.members[0],{wa:w,oi:o});toast("WhatsApp preference saved")}catch(e){toast(e.message)}}
async function prayS(){const x=$("pr").value.trim();if(!x)return;try{await api("POST","/api/member/prayer",{x},MT);$("pr").value="";toast("Prayer request sent to the pastor")}catch(e){toast(e.message)}}
async function boot(){if(location.protocol.startsWith("http")){try{await loadPub();SM=true}catch(e){}}render()}
boot();
</script></body></html>
