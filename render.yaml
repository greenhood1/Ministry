services:
  - type: web
    name: church-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: church-db
          property: connectionString
      - key: SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: church-db
    plan: free
